# What the secret scan should not call a secret.
#
# Read by gitleaks in .github/workflows/security.yml. The default rules stay
# in force; this file only subtracts the findings that are wrong.
#
# The one that made the scan red: the generic-api-key rule is entropy on a
# string that sits near a word like "key", and infra/platform.bicep holds the
# ids of Azure's built-in roles. `roleKeyVaultSecretsUser` is a GUID
# Microsoft publishes in its own docs, not a credential. A bare lowercase
# GUID is never a secret in this repository, so the rule below says so once,
# for every file, rather than in a comment beside each of them.
#
# The allowlist is in gitleaks' single `[allowlist]` form on purpose: the
# plural `[[allowlists]]` form is silently ignored by the 8.24 build the
# action runs, proven both ways with the binary before this note was written.
# Real credentials stay caught: an AWS-style key and a Stripe-style secret in
# one scratch file were both still reported under this config.
title = "yourhoasis"

[extend]
useDefault = true

[allowlist]
description = "A public id is not a credential, and neither is the scrubber test's fake Stripe key."
regexTarget = "secret"
regexes = [
  '''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
  # The log scrubber's unit test holds this exact fake Stripe key to prove an
  # innocent field name does not save a key-shaped value. A pull request scan
  # only reads its own commits, so the file sat quiet until the scheduled scan
  # and a hand-started run read every commit ever written. This is the whole
  # literal, not a pattern: any other sk_live_ value stays a finding.
  '''^sk_live_abcdefghijklmnop$''',
]
