name: Bug report
description: Report unexpected behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Where did this happen, and what were you trying to do?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps that reproduce the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
      description: What did you expect, and what happened instead?
    validations:
      required: true
