# Builds the image in Azure Container Registry and points the Container App at
# it, after the check workflow has passed on main. Signs in with the GitHub
# identity from infra/platform.bicep: no stored credential, GitHub's OIDC
# token for this branch is what Azure trusts.
#
# Inert until the three repository variables exist (Settings, Secrets and
# variables, Actions, Variables): AZURE_CLIENT_ID (the github identity's
# client id, an output of provision.sh), AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
name: deploy to azure

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.AZURE_CLIENT_ID != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build in the registry and roll the app
        run: scripts/azure/deploy.sh "${{ github.event.workflow_run.head_sha || github.sha }}"
