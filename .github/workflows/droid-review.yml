name: Droid Auto Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # FACTORY_API_KEY is a repository secret Monish has not set yet, and the
  # action fails hard without it, which put a red Droid Auto Review on every
  # pull request. This job asks only whether the key exists; the review below
  # is skipped, cleanly, until the secret is added.
  has-key:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        run: echo "present=${{ secrets.FACTORY_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
  droid-review:
    needs: has-key
    if: needs.has-key.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Run Droid Auto Review
        uses: Factory-AI/droid-action@main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          allowed_bots: factory-droid
          automatic_security_review: true
